---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/cart":
    get:
      summary: List cart items
      tags:
      - Cart
      responses:
        '200':
          description: returned cart
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Cart"
    post:
      summary: Create a new cart
      tags:
      - Cart
      parameters: []
      responses:
        '201':
          description: cart created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Cart"
        '404':
          description: product not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: invalid quantity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
              required:
              - product_id
  "/cart/add_item":
    post:
      summary: Add item to cart (or change quantity)
      tags:
      - Cart
      parameters: []
      responses:
        '200':
          description: item added
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Cart"
        '422':
          description: invalid quantity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: product not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
              required:
              - product_id
  "/cart/{product_id}":
    delete:
      summary: Remove item from cart
      tags:
      - Cart
      parameters:
      - name: product_id
        in: path
        description: Product ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: item removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Cart"
        '404':
          description: product not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: invalid removal
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/products":
    get:
      summary: Lista produtos
      tags:
      - Product list
      responses:
        '200':
          description: listed products
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Product"
  "/products/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show product
      tags:
      - Products
      responses:
        '200':
          description: product found
        '404':
          description: product not found
    put:
      summary: Update product
      tags:
      - Products
      parameters: []
      responses:
        '200':
          description: updated product
        '404':
          description: product not found
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Product"
    delete:
      summary: Remove product
      tags:
      - Products
      responses:
        '204':
          description: product deleted
        '404':
          description: product not found
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Product name
        price:
          type: number
          format: float
          example: 99.9
        description:
          type: string
          example: Optional description
        created_at:
          type: string
          format: date-time
          example: '2025-10-12T21:41:02Z'
        updated_at:
          type: string
          format: date-time
          example: '2025-10-12T21:41:02Z'
      required:
      - id
      - name
      - price
    CartItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Product name
        unit_price:
          type: number
          format: float
          example: 99.9
        quantity:
          type: integer
          example: 2
        total_price:
          type: number
          format: float
          example: 199.8
      required:
      - id
      - name
      - unit_price
      - quantity
      - total_price
    Cart:
      type: object
      properties:
        id:
          type: integer
          example: 123
        products:
          type: array
          items:
            "$ref": "#/components/schemas/CartItem"
        total_price:
          type: number
          format: float
          example: 199.8
      required:
      - id
      - total_price
      - products
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
          example:
          - quantity must be greater than 0
        error:
          type: string
          example: Product not found
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
